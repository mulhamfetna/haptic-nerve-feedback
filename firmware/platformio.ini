; H1 neural-haptics stimulator firmware — ESP32-S3
; Build:  pio run            Flash:  pio run -t upload
; Tests:  pio test -e native (parameter/safety logic, no hardware needed)

[env:esp32s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.0.4

[env:native]
platform = native
build_flags = -std=c++17
test_filter = test_params
